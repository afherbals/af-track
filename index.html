<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>AF Herbals — Track Your Order</title>
<style>
:root{--bg:#05070d;--acc:#00d4aa;--cyan:#22d3ee;--blue:#4a9eff;--amber:#ffa502;--red:#ff4757;--purple:#a55eea;--text:#eaf2ff;--text2:#93a1bd;--border:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100%}
body{padding:18px 14px 44px;overflow-x:hidden}
.bgfx{position:fixed;inset:-20%;z-index:-1;background:radial-gradient(ellipse 40% 35% at 20% 20%,rgba(0,212,170,.18),transparent 70%),radial-gradient(ellipse 35% 30% at 85% 15%,rgba(139,92,246,.16),transparent 70%),radial-gradient(ellipse 45% 35% at 60% 90%,rgba(34,211,238,.14),transparent 70%);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2%,2%,0) scale(1.08)}}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;padding-top:4px}
.logo{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#0f6b4f,var(--acc));display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 26px rgba(0,212,170,.5);animation:floatY 3.4s ease-in-out infinite}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.brand b{display:block;font-size:17px;font-weight:800;letter-spacing:-.2px}
.brand span{font-size:11px;color:var(--text2)}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid var(--border);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.1);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.scene-card{padding:16px 14px 18px;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 4px 12px}
.oid{font-size:20px;font-weight:900;letter-spacing:-.4px}
.odate{font-size:11.5px;color:var(--text2);margin-top:2px}
.badge{padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:800;border:1px solid;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.moving .badge i{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
/* ───────── 3D SCENE ───────── */
.stage{position:relative;width:100%;perspective:1000px;overflow:hidden;border-radius:16px;border:1px solid var(--border);background:#070b1c}
.tilt3d{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.inner{position:absolute;left:0;top:0;width:800px;height:300px;transform-origin:0 0;transform:scale(var(--s,1));transform-style:preserve-3d}
.layer{position:absolute;left:0;top:0;width:800px;height:300px;overflow:visible}
.l0{transform:translateZ(-70px) scale(1.07)}
.l1{transform:translateZ(-45px) scale(1.045)}
.l2{transform:translateZ(-20px) scale(1.02)}
.l4{transform:translateZ(30px) scale(.97);pointer-events:none}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.par{animation:scrollx var(--d,24s) linear infinite;animation-play-state:paused}
.moving .par{animation-play-state:running}
@keyframes scrollx{to{transform:translateX(-800px)}}
.dash{animation:dashmove .7s linear infinite;animation-play-state:paused}
.moving .dash{animation-play-state:running}
@keyframes dashmove{to{stroke-dashoffset:-26}}
.spokes{transform-box:fill-box;transform-origin:center;animation:spin .45s linear infinite;animation-play-state:paused}
.moving .spokes{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob .35s ease-in-out infinite alternate;animation-play-state:paused}
.moving .bob{animation-play-state:running}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-1.4px)}}
.puff{opacity:0}
.moving .puff{animation:puff 1s ease-out infinite}
.moving .puff:nth-child(2){animation-delay:.33s}.moving .puff:nth-child(3){animation-delay:.66s}
@keyframes puff{0%{opacity:.55;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(-26px,-8px) scale(1.6)}}
.speed{opacity:0}
.moving .speed{animation:speed .5s linear infinite}
.moving .speed:nth-child(2){animation-delay:.17s}.moving .speed:nth-child(3){animation-delay:.34s}
@keyframes speed{0%{opacity:.7;transform:translateX(8px)}100%{opacity:0;transform:translateX(-30px)}}
.beam{opacity:0;transition:opacity .6s}
.lit .beam{opacity:1}
.pinb{animation:pinb 1.6s ease-in-out infinite}
@keyframes pinb{50%{transform:translateY(-5px)}}
.parcel{opacity:0}
.done-scene .parcel{animation:drop .8s cubic-bezier(.3,1.6,.5,1) .2s forwards}
@keyframes drop{from{opacity:0;transform:translateY(-34px) scale(.6)}to{opacity:1;transform:none}}
.glowhouse{opacity:0;transition:opacity .8s}
.done-scene .glowhouse{opacity:1}
.cancelled-scene #van{filter:grayscale(.9) brightness(.8)}
.confetti i{position:absolute;width:7px;height:11px;border-radius:2px;opacity:0;animation:conf 1.5s ease-out forwards}
@keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}
.eta{text-align:center;font-size:13.5px;color:var(--text2);padding:12px 6px 4px;min-height:36px}
.eta b{color:var(--text)}
/* ───────── STEPPER ───────── */
.stepper{position:relative;display:flex;justify-content:space-between;padding:10px 6px 0;margin-top:6px}
.rail{position:absolute;left:30px;right:30px;top:27px;height:4px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--cyan));box-shadow:0 0 14px var(--acc);border-radius:3px;transition:width 1.6s cubic-bezier(.4,0,.2,1)}
.step{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:7px;width:25%;text-align:center}
.dot{width:36px;height:36px;border-radius:50%;background:#0d1426;border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:16px;filter:grayscale(1);opacity:.6;transition:all .5s}
.step.done .dot{border-color:var(--acc);background:rgba(0,212,170,.16);filter:none;opacity:1}
.step.cur .dot{border-color:var(--c,var(--acc));background:rgba(255,255,255,.06);filter:none;opacity:1;box-shadow:0 0 0 0 var(--c,var(--acc));animation:ring 1.8s infinite}
.step.cur.finished .dot{animation:none;box-shadow:0 0 22px var(--c)}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--c)}100%{box-shadow:0 0 0 14px transparent}}
.step small{font-size:10.5px;color:var(--text2);font-weight:600;line-height:1.25}
.step.done small,.step.cur small{color:var(--text)}
.replay{align-self:center;margin:14px auto 0;display:block;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text2);padding:7px 16px;border-radius:18px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s}
.replay:hover{color:var(--acc);border-color:var(--acc);box-shadow:0 0 18px rgba(0,212,170,.25)}
.banner{display:none;margin:12px 4px 0;padding:11px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(0,212,170,.2),rgba(34,211,238,.08));border:1px solid rgba(0,212,170,.5);text-align:center;font-weight:800;color:#5ff2d3}
.done-scene .banner{display:block;animation:bounceIn .7s cubic-bezier(.3,1.5,.5,1) 1.6s both}
@keyframes bounceIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
/* ───────── WAYBILL (3D) ───────── */
.wb-wrap{perspective:1100px;display:flex;justify-content:center}
.wb-title{text-align:center;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text2);font-weight:700}
.wb-tilt{position:relative;width:100%;max-width:380px;transform-style:preserve-3d;will-change:transform}
.sheet{--w:375px;font-size:calc(var(--w) / 30);width:100%;aspect-ratio:100/150;background:#fff;color:#111;border-radius:6px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 60px rgba(0,212,170,.18);opacity:0;transform:rotateY(-85deg) translateZ(-80px);transform-origin:left center}
.sheet.in{animation:flip .95s cubic-bezier(.2,.9,.3,1.1) forwards}
@keyframes flip{from{opacity:0;transform:rotateY(-85deg) translateZ(-80px)}to{opacity:1;transform:none}}
.glare{position:absolute;inset:0;border-radius:6px;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.35),transparent 55%);opacity:var(--go,0);mix-blend-mode:soft-light;transition:opacity .25s}
.s-head{display:flex;align-items:center;gap:.8em;padding:1em 1.1em .8em}
.s-logo{width:3.7em;height:3.7em;border-radius:50%;background:linear-gradient(135deg,#0f6b4f,#00b894);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.9em;flex-shrink:0}
.s-brand{flex:1;min-width:0}
.s-brand b{display:block;font-size:1.12em;font-weight:900;line-height:1.15}
.s-brand span{font-size:.68em;color:#666}
.s-id{text-align:right}
.s-id small{display:block;font-size:.64em;color:#666;letter-spacing:.5px}
.s-id b{display:block;font-size:1.52em;font-weight:900;line-height:1.1}
.s-id span{font-size:.72em;color:#666}
.s-rule{height:3px;background:#111}
.s-blk{padding:.7em 1.1em .5em}
.s-blk h4{font-size:1.04em;font-weight:900;letter-spacing:.2px;margin-bottom:.35em}
.s-blk div{margin-bottom:.15em;line-height:1.3}
.s-blk strong{font-weight:800}
.s-thin{height:1px;background:#ccc;margin:0 1.1em}
.s-pay{border-top:1.5px solid #111;border-bottom:1.5px solid #111;text-align:center;padding:.7em 0;margin-top:.3em}
.s-pay span{font-size:.95em;font-weight:700}
.s-pay b{font-size:1.4em;font-weight:900;margin-left:.3em}
.s-foot{margin-top:auto;display:flex;align-items:center;gap:1.3em;padding:0 1.1em 1em}
.s-qr{width:8.6em;height:8.6em;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.s-qr img,.s-qr canvas{width:100%!important;height:100%!important}
.s-bar{flex:1;text-align:center}
.s-bar canvas{display:block;width:100%;height:4.3em;margin-bottom:.3em}
.s-bar span{font-family:monospace;font-size:.75em;letter-spacing:1.2px;color:#333}
.footer{text-align:center;font-size:12px;color:var(--text2);line-height:1.8}
.footer a{color:var(--acc);text-decoration:none;font-weight:700}
.loading,.err{text-align:center;padding:70px 20px;color:var(--text2)}
.spin{width:38px;height:38px;border:3px solid rgba(255,255,255,.12);border-top-color:var(--acc);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px}
.err b{display:block;font-size:17px;color:var(--red);margin-bottom:6px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media print{.bgfx,.scene-card,.wb-title,.footer{display:none!important}.sheet{opacity:1!important;transform:none!important;box-shadow:none!important}}
</style>
</head>

function rnd(seed){var s=seed;return function(){s=(s*16807)%2147483647;return s/2147483647;};}

/* ---------- scene builders ---------- */
function skyline(seed,baseY,minH,maxH,color,windows){
  var r=rnd(seed),x=0,seg='';
  while(x<800){
    var w=18+r()*34, h=minH+r()*(maxH-minH);
    if(x+w>770) w=800-x;

   '<g transform="translate(740,120)"><ellipse class="glowhouse" cx="0" cy="-16" rx="52" ry="40" fill="#00d4aa" opacity=".16"/><path d="M-22,0 V-26 L0,-44 L22,-26 V0 Z" fill="#17325a" stroke="#4a9eff" stroke-opacity=".7"/><rect x="-5" y="-15" width="10" height="15" fill="#ffd36b"/><rect x="9" y="-24" width="8" height="8" fill="#ffd36b" opacity=".8"/>'+
    '<g class="parcel"><rect x="-4" y="6" width="16" height="12" rx="2" fill="#c98a3b" stroke="#ffd9a0"/><line x1="4" y1="6" x2="4" y2="18" stroke="#ffd9a0"/></g>'+
    '<g class="pinb"><path d="M0,-72 c-9,0 -15,6 -15,14 c0,10 15,24 15,24 s15,-14 15,-24 c0,-8 -6,-14 -15,-14 z" fill="#ff4757" stroke="#fff" stroke-width="1.2"/><circle cx="0" cy="-58" r="5" fill="#fff"/></g></g>'+
   '<text x="738" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#cfe6ff" font-family="Segoe UI,Arial">'+esc(toName)+'</text>'+
   van+
  '</svg>'+
  '<div class="layer l4 confetti" id="confetti"></div>';
}

function buildPage(o){
  var fromName=(o.from_city||'Trincomalee').split(' - ')[0];
  var toName=String(o.to_city||'Destination').split(' - ')[0];
  if(toName.length>18)toName=toName.slice(0,17)+'…';
  var steps='';
  for(var i=0;i<4;i++)steps+='<div class="step" id="st'+i+'"><div class="dot">'+ICONS[i]+'</div><small>'+LABELS[i]+'</small></div>';
  $('app').innerHTML=
   '<div class="brand"><div class="logo">🌿</div><div><b>AF Herbals (Pvt) Ltd</b><span>Live order tracking</span></div></div>'+
   '<section class="glass scene-card" id="sceneCard">'+
     '<div class="top-row"><div><div class="oid" id="oid"></div><div class="odate" id="odate"></div></div><span class="badge" id="badge"></span></div>'+
     '<div class="stage" id="stage"><div class="tilt3d" id="tilt1"><div class="inner" id="inner">'+sceneHTML(fromName,toName)+'</div></div></div>'+
     '<div class="eta" id="eta"></div>'+
     '<div class="stepper"><div class="rail"><div class="fill" id="fill"></div></div>'+steps+'</div>'+
     '<div class="banner" id="banner">✅ Delivered successfully!</div>'+
     '<button class="replay" id="replay" type="button">↻ Replay journey</button>'+
   '</section>'+
   '<div class="wb-title">Your waybill</div>'+
   '<section class="wb-wrap"><div class="wb-tilt" id="tilt2"><div class="sheet" id="sheet"></div><div class="glare" id="glare"></div></div></section>'+
   '<div class="footer">Sender: AF Herbals (Pvt) Ltd, Trincomalee<br>Contact: <a href="tel:0774663542">0774663542</a> | <a href="tel:0762069085">0762069085</a></div>';
  built=true;
  L=$('routePath').getTotalLength();
  var tr=$('trail');tr.style.strokeDasharray=L;tr.style.strokeDashoffset=L;
  fitStage();
  $('replay').onclick=function(){replay();};
  setupObservers();
}

function fitStage(){
  var st=$('stage'); if(!st)return;
  var s=st.clientWidth/800;
  st.style.height=(300*s)+'px';
  $('inner').style.setProperty('--s',s);
  var sh=$('sheet'); if(sh)sh.style.setProperty('--w',sh.clientWidth+'px');
}
window.addEventListener('resize',fitStage);

/* ---------- render order data ---------- */
function renderStatic(o){
  var c=COLOR[o.status]||COLOR.Pending;
  $('oid').textContent='#'+o.id;
  $('odate').textContent=o.date||'';
  var b=$('badge');b.innerHTML='<i></i>'+esc(o.status||'Pending');b.style.color=c;b.style.borderColor=c+'66';b.style.background=c+'1f';
  $('eta').innerHTML=MSG[o.status]||MSG.Pending;
  var phones=[maskPhone(o.rphone),maskPhone(o.rphone2)].filter(Boolean).join(' / ')||'—';
  var amt=parseFloat(o.amount||0).toLocaleString('en-LK',{minimumFractionDigits:2});
  var payLabel=o.payment==='Cash on Delivery'?'COD':o.payment==='Paid'?'PAID':'AMOUNT';
  var sheet=$('sheet');
  sheet.innerHTML=
   '<div class="s-head"><div class="s-logo">🌿</div><div class="s-brand"><b>AF HERBALS (PVT) LTD</b><span>Nature\'s finest, delivered with care.</span></div><div class="s-id"><small>WAYBILL ID</small><b>'+esc(o.id)+'</b><span>Date: '+esc(o.date||'')+'</span></div></div>'+
   '<div class="s-rule"></div>'+
   '<div class="s-blk"><h4>RECIPIENT DETAILS</h4><div><strong>Name:</strong> '+esc(o.recipient||'—')+'</div><div><strong>Address:</strong> '+esc(o.raddr||'—')+'</div><div><strong>Contact No:</strong> '+esc(phones)+'</div><div><strong>City:</strong> '+esc(o.to_city||'—')+'</div></div>'+
   '<div class="s-thin"></div>'+
   '<div class="s-blk"><h4>PICKUP DETAILS</h4><div><strong>Name:</strong> AF HERBALS (PVT) LTD</div><div><strong>Address:</strong> Trincomalee</div><div><strong>Contact No:</strong> 0774663542</div><div><strong>Weight:</strong> '+esc(o.weight||'1.0')+' kg</div><div><strong>Order ID:</strong> '+esc(o.id)+'</div><div><strong>Service:</strong> '+esc(o.service||'Standard')+' &nbsp;|&nbsp; <strong>Route:</strong> '+esc((o.from_city||'Trincomalee')+' → '+(o.to_city||'—'))+'</div><div><strong>Parcel Desc:</strong> '+esc(o.description||'—')+'</div></div>'+
   '<div class="s-pay"><span>'+payLabel+' :</span><b>'+esc(amt)+' LKR</b></div>'+
   '<div class="s-foot"><div class="s-qr" id="qrbox"></div><div class="s-bar"><canvas id="bcv"></canvas><span id="bnum"></span></div></div>';
  sheet.style.setProperty('--w',sheet.clientWidth+'px');
  try{ new QRCode($('qrbox'),{text:location.href.split('#')[0],width:140,height:140,colorDark:'#111',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M}); }catch(e){}
  drawBarcode(o.id);
}

function drawBarcode(orderId){
  var hash=orderId.split('').reduce(function(a,c){return Math.imul(31,a)+c.charCodeAt(0)|0;},0)>>>0;
  var num=String(hash).padStart(8,'0').slice(0,8), code='271'+num+'4';
  $('bnum').textContent=code;
  var cv=$('bcv'),ctx=cv.getContext('2d'),digits=code.split('').map(Number);
  var P={0:'nnwwn',1:'wnnnw',2:'nwnnw',3:'wwnnn',4:'nnwnw',5:'wnwnn',6:'nnwwn',7:'nwnwn',8:'wnnwn',9:'nwwnn'},bars=[];
  bars.push({w:2,d:1},{w:1,d:0},{w:1,d:1},{w:1,d:0});
  digits.forEach(function(d,i){(P[d]||'nnnww').split('').forEach(function(c,ci){bars.push({w:c==='w'?3:1,d:ci%2===0});});if(i<digits.length-1)bars.push({w:1,d:0});});
  bars.push({w:1,d:0},{w:2,d:1},{w:1,d:0},{w:1,d:1});
  var tw=bars.reduce(function(s,b){return s+b.w;},0);
  cv.width=Math.max(tw*2,200);cv.height=48;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
  var sc=cv.width/tw,x=0;
  bars.forEach(function(b){var bw=b.w*sc;if(b.d){ctx.fillStyle='#111';ctx.fillRect(x,0,bw-.4,cv.height);}x+=bw;});
}

/* ---------- vehicle engine ---------- */
function placeVan(p){
  var van=$('van'),path=$('routePath'); if(!van||!path)return;
  p=Math.max(0,Math.min(1,p));
  var d=p*L,a=path.getPointAtLength(Math.max(0,d-2)),b=path.getPointAtLength(Math.min(L,d+2)),m=path.getPointAtLength(d);
  var ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
  van.setAttribute('transform','translate('+m.x.toFixed(1)+','+m.y.toFixed(1)+') rotate('+ang.toFixed(1)+') scale(1.15)');
  $('trail').style.strokeDashoffset=L*(1-p);
}
function setMoving(on){var c=$('sceneCard');if(c)c.classList.toggle('moving',!!on);}
function setScene(status){
  var c=$('sceneCard'); if(!c)return;
  c.classList.toggle('lit',status!=='Pending');
  c.classList.toggle('done-scene',status==='Delivered');
  c.classList.toggle('cancelled-scene',status==='Cancelled');
}
function animateTo(target,from,instant){
  cancelAnimationFrame(raf);
  var start=performance.now(),dist=Math.abs(target-from),dur=(instant||REDUCED)?0:Math.max(900,3800*dist+900);
  var driving=(dist>.001)||curStatus==='In Transit';
  setMoving(driving&&curStatus!=='Cancelled'&&dist>.001||curStatus==='In Transit');
  function step(now){
    var t=dur?Math.min(1,(now-start)/dur):1,e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    prog=from+(target-from)*e; placeVan(prog);
    if(t<1){raf=requestAnimationFrame(step);}else{arrived();}
  }
  raf=requestAnimationFrame(step);
}
function arrived(){
  setMoving(curStatus==='In Transit');
  if(curStatus==='Delivered')celebrate();
}
function celebrate(){
  var box=$('confetti'); if(!box||box.childNodes.length)return;
  var cols=['#00d4aa','#22d3ee','#ffd36b','#a55eea','#ff6b81','#4a9eff'],h='';
  for(var i=0;i<34;i++){
    var dx=(Math.random()*240-120).toFixed(0),dy=(Math.random()*-150-20).toFixed(0),rot=(Math.random()*720-360).toFixed(0);
    h+='<i style="left:740px;top:96px;background:'+cols[i%cols.length]+';--dx:'+dx+'px;--dy:'+dy+'px;--rot:'+rot+'deg;animation-delay:'+(Math.random()*.25).toFixed(2)+'s"></i>';
  }
  box.innerHTML=h;
}
function updateSteps(status){
  var idx=STEPS.indexOf(status),c=COLOR[status]||COLOR.Pending;
  for(var i=0;i<4;i++){
    var el=$('st'+i); if(!el)continue;
    el.className='step'+(i<idx?' done':'')+(i===idx?' cur'+(status==='Delivered'?' finished':''):'');
    el.style.setProperty('--c',c);
  }
  var fill=$('fill'); if(fill){fill.style.width=(status==='Cancelled'?0:Math.max(0,idx)/3*100)+'%';fill.style.background=status==='Cancelled'?'#ff4757':'';}
  if(status==='Cancelled'){var el0=$('st0');if(el0)el0.className='step done';}
}
function replay(){
  var box=$('confetti'); if(box)box.innerHTML='';
  var c=$('sceneCard'); if(c)c.classList.remove('done-scene');
  setScene(curStatus); if(curStatus==='Delivered'){ $('sceneCard').classList.remove('done-scene'); setTimeout(function(){setScene('Delivered');},30); }
  animateTo(TARGET[curStatus]||0,0);
}

/* ---------- data ---------- */
function applyOrder(o,first){
  var changed=!order||order.status!==o.status, prev=order;
  order=o;
  if(first){buildPage(o);}
  renderStatic(o);
  var st=o.status||'Pending';
  if(first){
    curStatus=st; setScene(st); updateSteps(st);
    placeVan(0);
    setTimeout(function(){animateTo(TARGET[st]!=null?TARGET[st]:0,0);},500);
  }else if(changed){
    var from=prog; curStatus=st; setScene(st); updateSteps(st);
    var box=$('confetti'); if(box&&st!=='Delivered')box.innerHTML='';
    animateTo(TARGET[st]!=null?TARGET[st]:0,from);
  }
}
function fetchOrder(id){
  return fetch(SUPA_URL+'/rest/v1/orders?id=eq.'+encodeURIComponent(id)+'&limit=1',{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}})
   .then(function(r){if(!r.ok)throw new Error('Could not load the order');return r.json();})
   .then(function(d){if(!d||!d.length)throw new Error('Order not found');return d[0];});
}
function showError(msg){
  $('app').innerHTML='<div class="brand"><div class="logo">🌿</div><div><b>AF Herbals (Pvt) Ltd</b><span>Live order tracking</span></div></div><div class="glass err"><b>Order not found</b>'+esc(msg)+'<div style="margin-top:12px;font-size:12px">Contact AF Herbals: <a style="color:#00d4aa" href="tel:0774663542">0774663542</a></div></div>';
}

/* ---------- 3D tilt (pointer + idle sway) + waybill flip-in ---------- */
var tilts=[];
function setupObservers(){
  tilts=[
    {el:$('tilt1'),host:$('stage'),k:7,rx:0,ry:0,tx:0,ty:0,hover:false,ph:0},
    {el:$('tilt2'),host:$('tilt2'),k:9,rx:0,ry:0,tx:0,ty:0,hover:false,ph:1.7,glare:$('glare')}
  ];
  tilts.forEach(function(t){
    t.host.addEventListener('pointermove',function(e){
      var r=t.host.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
      t.hover=true;t.ty=(px-.5)*t.k*2;t.tx=(.5-py)*t.k*2;
      if(t.glare){t.glare.style.setProperty('--gx',(px*100)+'%');t.glare.style.setProperty('--gy',(py*100)+'%');t.glare.style.setProperty('--go',1);}
    },{passive:true});
    t.host.addEventListener('pointerleave',function(){t.hover=false;if(t.glare)t.glare.style.setProperty('--go',0);});
  });
  if(!REDUCED)requestAnimationFrame(tiltLoop);
  var sheet=$('sheet');
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){sheet.classList.add('in');io.disconnect();}});},{threshold:.2});
    io.observe(sheet);
  }else sheet.classList.add('in');
}
function tiltLoop(now){
  var t=now/1000;
  tilts.forEach(function(o){
    if(!o.el)return;
    if(!o.hover){o.tx=Math.sin(t*.6+o.ph)*o.k*.22;o.ty=Math.cos(t*.5+o.ph)*o.k*.28;}
    o.rx+=(o.tx-o.rx)*.08;o.ry+=(o.ty-o.ry)*.08;
    o.el.style.transform='rotateX('+o.rx.toFixed(2)+'deg) rotateY('+o.ry.toFixed(2)+'deg)';
  });
  requestAnimationFrame(tiltLoop);
}

/* ---------- boot ---------- */
(function(){
  var id=new URLSearchParams(location.search).get('id');
  if(!id){showError('No order ID in this link.');return;}
  fetchOrder(id).then(function(o){applyOrder(o,true);}).catch(function(e){showError(e.message);});
  setInterval(function(){
    if(document.hidden||!order)return;
    fetchOrder(id).then(function(o){applyOrder(o,false);}).catch(function(){});
  },20000);
})();
</script>
